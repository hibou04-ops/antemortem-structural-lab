[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "antemortem-structural-lab"
version = "0.8.0a1"
requires-python = ">=3.11"
description = "Experimental contract-driven Python counterexample search, replay and evidence recording"
readme = "README.md"
license = "Apache-2.0 AND MIT AND BSD-3-Clause"
license-files = ["LICENSE", "benchmarks/historical/vendor/*-LICENSE.txt"]

[project.urls]
Repository = "https://github.com/hibou04-ops/antemortem-structural-lab"
Changelog = "https://github.com/hibou04-ops/antemortem-structural-lab/blob/main/CHANGELOG.md"
Documentation = "https://github.com/hibou04-ops/antemortem-structural-lab#readme"
Issues = "https://github.com/hibou04-ops/antemortem-structural-lab/issues"

[project.scripts]
tomolab = "tomolab.cli:main"

[project.optional-dependencies]
solver = ["z3-solver>=4.13,<6"]
qa = ["hypothesis>=6.100,<7", "psutil>=5.9,<8"]
analysis = ["crosshair-tool>=0.0.112,<0.1"]
corr = ["scipy==1.18.1; python_version >= '3.12'", "numpy==2.5.3; python_version >= '3.12'"]

[tool.setuptools.packages.find]
include = ["tomolab", "tomolab.*"]

[tool.setuptools.data-files]
"share/antemortem-structural-lab" = ["README.md", "README.ko.md", "SECURITY.md", "PUBLIC_IMPORT_NOTICE.md", "THIRD_PARTY_NOTICES.md"]
"share/antemortem-structural-lab/examples" = ["examples/*.py"]
"share/antemortem-structural-lab/examples/claim_only" = ["examples/claim_only/*.py"]
"share/antemortem-structural-lab/examples/mold" = ["examples/mold/*.py", "examples/mold/*.json"]
"share/antemortem-structural-lab/examples/discovery" = ["examples/discovery/*.py", "examples/discovery/*.json"]
"share/antemortem-structural-lab/examples/temporal" = ["examples/temporal/*.py", "examples/temporal/*.json"]
"share/antemortem-structural-lab/examples/knowledge" = ["examples/knowledge/*.py", "examples/knowledge/*.json"]
"share/antemortem-structural-lab/examples/evidence" = ["examples/evidence/*.py", "examples/evidence/*.json", "examples/evidence/README.ko.md"]
"share/antemortem-structural-lab/examples/partial" = ["examples/partial/*.py", "examples/partial/*.json"]
"share/antemortem-structural-lab/examples/numerical" = ["examples/numerical/*.json", "examples/numerical/*.sha256"]

"share/antemortem-structural-lab/examples/online" = ["examples/online/*.py", "examples/online/*.json"]
"share/antemortem-structural-lab/examples/product" = ["examples/product/*.py", "examples/product/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
