name: Publish verified experimental product

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Approved experimental version (for example 0.8.0a1)'
        required: true
        type: string
      release_sha:
        description: 'Exact approved main commit SHA (40 lowercase hex characters)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-antemortem-structural-lab
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ inputs.version }}
  RELEASE_SHA: ${{ inputs.release_sha }}

defaults:
  run:
    shell: bash

jobs:
  source-and-tag:
    if: github.repository == 'hibou04-ops/antemortem-structural-lab' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact approved main and successful required CI, then create immutable annotated tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/product-publication.py tag

  build:
    needs: source-and-tag
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install normal build and metadata tools
        run: python -m pip install build twine
      - name: Build the one final distribution set shared by GitHub and PyPI
        run: python -m build
      - name: Check metadata and public file scope
        run: |
          python -m twine check dist/*
          python scripts/check-public-scope.py
      - name: Recheck source CI and bind exact distribution files to reviewed source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/product-publication.py manifest
      - name: Verify this final wheel and sdist outside the checkout using normal dependency installation
        run: python scripts/check-product-wheel.py --source-sha "$RELEASE_SHA" --output verification/product-install.json
      - name: Enforce product-only publication authorization with actual CI and installation receipts
        run: python scripts/check-product-release.py --source-sha "$RELEASE_SHA" --ci-receipt verification/source-ci.json --installation-receipt verification/product-install.json --output verification/product-gate.json
      - uses: actions/upload-artifact@v4
        with:
          name: product-distributions
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: product-validation
          path: verification/*.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: product-checksums
          path: verification/SHA256SUMS.txt
          if-no-files-found: error

  draft:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: product-distributions
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: product-validation
          path: verification
      - uses: actions/download-artifact@v4
        with:
          name: product-checksums
          path: verification
      - name: Prepare a prerelease draft with the exact verified assets; never overwrite existing assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/product-publication.py draft
      - uses: actions/upload-artifact@v4
        with:
          name: product-draft-receipt
          path: verification/draft-release.json
          if-no-files-found: error

  publish:
    needs: draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/antemortem-structural-lab/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: product-distributions
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: product-validation
          path: verification
      - id: files
        name: Check registry identity and prepare only genuinely missing immutable files
        run: python scripts/product-publication.py upload-directory
      - name: Publish through the existing project-scoped Trusted Publisher
        if: steps.files.outputs.publish_required == 'true'
        # Preserve the reviewed action SHA and the existing workflow/environment identity.
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          packages-dir: upload/
          skip-existing: false
          verify-metadata: true
          verbose: false
          print-hash: true
          attestations: true

  verify-public:
    needs: [draft, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: product-distributions
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: product-validation
          path: verification
      - name: Download and install public PyPI files, verify the description, publish the GitHub prerelease, and download its assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/product-publication.py public-verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-public-verification
          path: verification/public-*.json
          if-no-files-found: warn
