name: Python tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-public-user-audit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: v0.8.0a1
          path: published-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Audit exact public files and external-user commands without publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: python audit/public/run_audit.py --source published-source --output public-audit-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-public-audit-${{ runner.os }}-${{ matrix.python }}
          path: public-audit-results
          if-no-files-found: error
