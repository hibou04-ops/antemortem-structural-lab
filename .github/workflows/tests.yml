name: Python tests
permissions:
  contents: read
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and optional QA, solver and analysis integrations
        run: python -m pip install -e ".[solver,qa,analysis]"
      - name: Install test and build tools
        run: python -m pip install pytest build twine
      - name: Test
        run: python -m pytest -q --junitxml=test-results.xml
      - name: Build source distribution and wheel
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - name: Check public source and artifact contents
        run: python scripts/check-public-scope.py
      - name: Verify preserved E7 Git revision
        run: python scripts/check-historical-e7-freeze.py
      - name: Verify preserved E8 PR revision
        run: python scripts/check-historical-e8-freeze.py
      - name: Verify current R1 implementation commitment
        run: python scripts/check-e8r1-freeze.py
      - name: Check wheel outside the source checkout
        run: python scripts/check-wheel.py
      - name: Check optional QA integration in the installed wheel
        run: python scripts/check-wheel.py --qa
      - name: Run preserved E4 public regression fixtures
        run: python scripts/evaluate-e4.py --output e4-validation.json
      - uses: actions/upload-artifact@v4
        with:
          name: validation-${{ matrix.os }}-${{ matrix.python-version }}
          path: |
            test-results.xml
            e4-validation.json
  generator-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: docker pull python:3.12-slim
      - name: Verify restricted generator filesystem and network
        run: python scripts/check-isolation.py
  unified-generator-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[qa,solver]"
      - name: Build reviewed dependency-only E5 generator image
        run: docker build -f containers/e5-generator.Dockerfile -t tomolab-e5-generator:local containers
      - name: Verify actual E5 access control and integrated discovery
        run: python scripts/check-discovery-isolation.py
  temporal-generator-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[qa,solver]"
      - name: Build reviewed dependency-only E6 generator image
        run: docker build -f containers/e6-generator.Dockerfile -t tomolab-e6-generator:local containers
      - name: Verify E6 access controls, native state learning and replay
        run: python scripts/check-temporal-isolation.py
  knowledge-generator-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[qa,solver]"
      - name: Build reviewed dependency-only E7 generator image
        run: docker build -f containers/e7-generator.Dockerfile -t tomolab-e7-generator:local containers
      - name: Verify E7 access controls and evidence-qualified native discovery
        run: python scripts/check-knowledge-isolation.py
  release-eligibility:
    runs-on: ubuntu-latest
    outputs:
      allow_release: ${{ steps.gate.outputs.allow_release }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: gate
        name: Determine conditional E8 publication eligibility
        run: python scripts/check-e8-release-eligibility.py --github-output
  prerelease:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.release-eligibility.outputs.allow_release == 'true'
    needs: [tests, generator-isolation, unified-generator-isolation, temporal-generator-isolation, knowledge-generator-isolation, release-eligibility]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/check-public-scope.py
      - run: python scripts/check-wheel.py
      - run: python scripts/check-e8r1-freeze.py
      - name: Verify readiness and publish conditional E8 prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish-e8.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-receipt
          path: release-receipt.json
