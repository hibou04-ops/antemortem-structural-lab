name: Python tests
permissions:
  contents: read
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
jobs:
  # Product-repair and recursive-progress branches use explicitly bounded checks.
  # Legacy Source/historical jobs are excluded for both branch families;
  # actual new research is never hidden in the synthetic functional job.
  recursive-functional:
    if: startsWith(github.head_ref || github.ref_name, 'feat/recursive-progress-')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install authored-fixture verification dependencies
        run: |
          python -m pip install -e ".[qa,solver]"
          python -m pip install pytest build twine
      - name: Verify paired observation, selector, generation and restart behavior
        run: python -m pytest tests/test_recursive_observe.py tests/test_recursive_policy.py tests/test_recursive_store.py tests/test_recursive_integration.py tests/test_recursive_review.py tests/test_online_engine.py tests/test_online_boundary.py tests/test_online_observe.py tests/test_online_learning.py tests/test_online_authority.py tests/test_product_runtime_regressions.py tests/test_product_workflows.py tests/test_e7_knowledge.py -q --junitxml=recursive-regressions.xml
      - name: Execute authored G0 G1 G2 restart example
        run: python -m tomolab recursive-demo --workspace recursive-example --allow-local-execution
      - name: Build without publishing
        run: python -m build
      - name: Validate distribution metadata and public scope
        run: |
          python -m twine check dist/*
          python scripts/check-public-scope.py
      - name: Verify preserved historical registration without target execution
        run: python scripts/check-historical-freeze.py --revision 591f802dea6f8ac88a27af3ffd89bd6e1396b318 --manifest docs/HISTORICAL_PROFILE.json --output historical-preservation.json
      - name: Verify new recursive path from the installed wheel outside checkout
        run: python scripts/check-recursive-wheel.py --output recursive-installed.json
      - name: Verify installed wheel and sdist product workflows
        run: python scripts/check-product-runtime.py --output product-runtime.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recursive-functional-${{ matrix.os }}-${{ matrix.python-version }}
          path: |
            recursive-regressions.xml
            recursive-installed.json
            recursive-example/summary.json
            historical-preservation.json
            product-runtime.json
            dist/*
          if-no-files-found: error
  product-runtime-regression:
    if: startsWith(github.head_ref || github.ref_name, 'fix/product-runtime-diagnostics-')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install documented contributor dependencies
        run: |
          python -m pip install -e ".[qa]"
          python -m pip install pytest build twine
      - name: Collect contributor tests without running research
        run: python -m pytest --collect-only -q
      - name: Run bounded product regressions
        # The excluded legacy unit case trains a tiny Mold; this mission does
        # not need that path and authorizes no Source learning.
        run: python -m pytest tests/test_product_runtime_regressions.py tests/test_product_workflows.py -k "not explicit_D" -q --junitxml=product-regressions.xml
      - name: Build verification artifacts without publishing
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - name: Check public source and verification artifact scope
        run: python scripts/check-public-scope.py
      - name: Verify original historical registration without executing targets
        run: python scripts/check-historical-freeze.py --revision 591f802dea6f8ac88a27af3ffd89bd6e1396b318 --manifest docs/HISTORICAL_PROFILE.json --output historical-preservation.json
      - name: Install wheel and sdist outside checkout and exercise authored fixtures
        run: python scripts/check-product-runtime.py --output product-runtime.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-runtime-${{ matrix.os }}-${{ matrix.python-version }}
          path: |
            product-regressions.xml
            product-runtime.json
            historical-preservation.json
            dist/*
          if-no-files-found: error
  tests:
    if: ${{ !startsWith(github.head_ref || github.ref_name, 'fix/product-runtime-diagnostics-') && !startsWith(github.head_ref || github.ref_name, 'feat/recursive-progress-') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and optional QA, solver and analysis integrations
        run: python -m pip install -e ".[solver,qa,analysis]"
      - name: Install test and build tools
        run: python -m pip install pytest build twine
      - name: Test
        run: python -m pytest -q --junitxml=test-results.xml
      - name: Build source distribution and wheel
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - name: Check public source and artifact contents
        run: python scripts/check-public-scope.py
      - name: Verify preserved E7 Git revision
        run: python scripts/check-historical-e7-freeze.py
      - name: Verify preserved E8 PR revision
        run: python scripts/check-historical-e8-freeze.py
      - name: Verify preserved R1 Git revision
        run: python scripts/check-historical-e8r1-freeze.py
      - name: Verify R2 byte commitment and PyPI paths preserved from main
        run: |
          python scripts/check-historical-e8r2-freeze.py
          python scripts/check-historical-e8r3-freeze.py
          python scripts/check-historical-freeze.py --revision ff74d19737460f4b51910192adbadddf82389560 --manifest docs/E8_R4_CODE_FREEZE.json
      - name: Materialize the preserved R4 revision for its original PyPI path checks
        run: git worktree add --detach "${{ runner.temp }}/r2-preservation" ff74d19737460f4b51910192adbadddf82389560
      - name: Verify the original R2 publication paths without rewriting their checker
        working-directory: ${{ runner.temp }}/r2-preservation
        run: python scripts/check-r2-preservation.py
      - name: Verify the online algorithm registration without replaying research
        run: python scripts/check-historical-freeze.py --revision c92a094cf9092aa33b180ca733266705150a3d3f --manifest docs/ONLINE_PROFILE.json --allow-current-test-change tests/test_online_engine.py --allow-current-test-change tests/test_online_benchmark.py --allow-current-test-change tests/test_online_observe.py --output online-registration.json
      - name: Verify the original 226-file R1 registration without target execution
        run: python scripts/check-historical-freeze.py --revision 591f802dea6f8ac88a27af3ffd89bd6e1396b318 --manifest docs/HISTORICAL_PROFILE.json --output historical-registration.json
      - name: Check wheel outside the source checkout
        run: python scripts/check-wheel.py
      - name: Check optional QA integration in the installed wheel
        run: python scripts/check-wheel.py --qa
      - name: Verify numerical CLI from the installed candidate wheel
        run: python scripts/check-numerical-wheel.py --output numerical-wheel.json
      - name: Verify R3 runtime and audit from the installed candidate wheel
        run: python scripts/check-numerical-r3-wheel.py --output numerical-r3-wheel.json
      - name: Verify installed online Source learning and target-local discovery
        run: python scripts/check-online-wheel.py --output online-wheel.json
      - name: Run preserved E4 public regression fixtures
        run: python scripts/evaluate-e4.py --output e4-validation.json
      - uses: actions/upload-artifact@v4
        with:
          name: validation-${{ matrix.os }}-${{ matrix.python-version }}
          path: |
            test-results.xml
            e4-validation.json
            numerical-wheel.json
            numerical-r3-wheel.json
            online-wheel.json
            online-registration.json
            historical-registration.json
  product-installation:
    if: ${{ !startsWith(github.head_ref || github.ref_name, 'fix/product-runtime-diagnostics-') && !startsWith(github.head_ref || github.ref_name, 'feat/recursive-progress-') }}
    # Read-only product CI. Publication is a separate, manually invoked workflow.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install normal-index build tools
        run: python -m pip install build twine
      - name: Build the candidate source distribution and wheel
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - name: Verify static product publication policy without authorizing upload
        run: python scripts/check-product-release.py --static
      - name: Install both artifacts and verify the documented product workflows
        run: python scripts/check-product-wheel.py --source-sha "$(git rev-parse HEAD)" --output product-install.json
      - uses: actions/upload-artifact@v4
        with:
          name: product-installation
          path: |
            product-install.json
            dist/*
          if-no-files-found: error
  generator-isolation:
    if: ${{ !startsWith(github.head_ref || github.ref_name, 'fix/product-runtime-diagnostics-') && !startsWith(github.head_ref || github.ref_name, 'feat/recursive-progress-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: docker pull python:3.12-slim
      - name: Verify restricted generator filesystem and network
        run: python scripts/check-isolation.py
  unified-generator-isolation:
    if: ${{ !startsWith(github.head_ref || github.ref_name, 'fix/product-runtime-diagnostics-') && !startsWith(github.head_ref || github.ref_name, 'feat/recursive-progress-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[qa,solver]"
      - name: Build reviewed dependency-only E5 generator image
        run: docker build -f containers/e5-generator.Dockerfile -t tomolab-e5-generator:local containers
      - name: Verify actual E5 access control and integrated discovery
        run: python scripts/check-discovery-isolation.py
  temporal-generator-isolation:
    if: ${{ !startsWith(github.head_ref || github.ref_name, 'fix/product-runtime-diagnostics-') && !startsWith(github.head_ref || github.ref_name, 'feat/recursive-progress-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[qa,solver]"
      - name: Build reviewed dependency-only E6 generator image
        run: docker build -f containers/e6-generator.Dockerfile -t tomolab-e6-generator:local containers
      - name: Verify E6 access controls, native state learning and replay
        run: python scripts/check-temporal-isolation.py
  knowledge-generator-isolation:
    if: ${{ !startsWith(github.head_ref || github.ref_name, 'fix/product-runtime-diagnostics-') && !startsWith(github.head_ref || github.ref_name, 'feat/recursive-progress-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[qa,solver]"
      - name: Match the reviewed dependency-only image versions for candidate equivalence
        run: python -m pip install hypothesis==6.170.11 z3-solver==5.3.2.0
      - name: Build reviewed dependency-only E7 generator image
        run: docker build -f containers/e7-generator.Dockerfile -t tomolab-e7-generator:local containers
      - name: Verify E7 access controls and evidence-qualified native discovery
        run: python scripts/check-knowledge-isolation.py
      - name: Execute the actual compact Source guide within the existing Docker controls
        run: python scripts/check-numerical-isolation.py --output compact-docker.json
      - name: Verify R3 runtime and audit using actual Docker workers
        run: python scripts/check-numerical-r3-isolation.py --output compact-r3-docker.json
      - uses: actions/upload-artifact@v4
        with:
          name: actual-compact-guide-docker-receipt
          path: |
            compact-docker.json
            compact-r3-docker.json
          if-no-files-found: error
  corroboration-integration:
    if: ${{ !startsWith(github.head_ref || github.ref_name, 'fix/product-runtime-diagnostics-') && !startsWith(github.head_ref || github.ref_name, 'feat/recursive-progress-') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned reviewed CORR libraries using the normal package index
        run: python -m pip install -e ".[qa,solver,corr]" build
      - name: Match the frozen Hypothesis generation version
        run: python -m pip install hypothesis==6.170.11
      - name: Build the unreleased candidate
        run: python -m build
      - name: Verify real CORR adapters and CLI in a fresh installed-wheel environment
        run: python scripts/check-corroboration-wheel.py --output corroboration-wheel.json
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-corroboration-functional-wheel
          path: corroboration-wheel.json
          if-no-files-found: error
  release-eligibility:
    if: ${{ !startsWith(github.head_ref || github.ref_name, 'fix/product-runtime-diagnostics-') && !startsWith(github.head_ref || github.ref_name, 'feat/recursive-progress-') }}
    runs-on: ubuntu-latest
    outputs:
      allow_release: ${{ steps.gate.outputs.allow_release }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: gate
        name: Determine conditional E8 publication eligibility
        run: python scripts/check-e8-release-eligibility.py --github-output
  historical-e7-release:
    if: (!startsWith(github.head_ref || github.ref_name, 'fix/product-runtime-diagnostics-') && !startsWith(github.head_ref || github.ref_name, 'feat/recursive-progress-')) && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch')
    needs: [tests, generator-isolation, unified-generator-isolation, temporal-generator-isolation, knowledge-generator-isolation]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize the pinned publication-workflow revision without altering research files
        run: git worktree add --detach "${{ runner.temp }}/pypi-publication-source" 3739e7dee2a7064d1c73f2c29dac30dc7c2eefe1
      - name: Verify historical E7 files through the preserved publication scripts, without uploading
        working-directory: ${{ runner.temp }}/pypi-publication-source
        run: python scripts/verify-pypi-release.py --download --check-registry --directory verified-public-e7 --receipt verification/existing-e7-release.json
      - uses: actions/upload-artifact@v4
        with:
          name: existing-e7-release-verification
          path: ${{ runner.temp }}/pypi-publication-source/verification/existing-e7-release.json
          if-no-files-found: error
  historical-functional:
    if: ${{ !startsWith(github.head_ref || github.ref_name, 'fix/product-runtime-diagnostics-') && !startsWith(github.head_ref || github.ref_name, 'feat/recursive-progress-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install normal build tools
        run: python -m pip install build
      - name: Build the candidate and reviewed dependency-only runtime
        run: |
          python -m build
          docker build -f containers/historical-review.Dockerfile -t tomolab-historical:reviewed .
      - name: Historical original/adapter/Oracle eligibility and Source-only budget preflight
        run: python scripts/check-historical-container.py --image tomolab-historical:reviewed --phase preflight --output-directory "${{ runner.temp }}/historical-preflight"
      - name: Installed wheel historical Source to fixed-control path
        run: python scripts/check-historical-container.py --image tomolab-historical:reviewed --phase wheel --output-directory "${{ runner.temp }}/historical-wheel"
      - name: Preserve safe receipts and encrypt raw local research records
        if: always()
        run: |
          python scripts/package-historical-artifacts.py --input "${{ runner.temp }}/historical-preflight" --public "${{ runner.temp }}/historical-public" --recipient docs/HISTORICAL_ARTIFACT_RECIPIENT.pem --label preflight
          python scripts/package-historical-artifacts.py --input "${{ runner.temp }}/historical-wheel" --public "${{ runner.temp }}/historical-public" --recipient docs/HISTORICAL_ARTIFACT_RECIPIENT.pem --label installed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-functional-reviewed-container
          path: ${{ runner.temp }}/historical-public/*
          if-no-files-found: error
  historical-study:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feat/e9-online-structural-transfer'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the exact reviewed runtime
        run: docker build -f containers/historical-review.Dockerfile -t tomolab-historical:reviewed .
      - name: Source preparation, durable algorithm/Mold freeze, then one registered comparison
        run: python scripts/check-historical-container.py --image tomolab-historical:reviewed --phase study --timeout 1500 --output-directory "${{ runner.temp }}/historical-study"
      - name: Preserve safe results and encrypted raw evidence
        if: always()
        run: python scripts/package-historical-artifacts.py --input "${{ runner.temp }}/historical-study" --public "${{ runner.temp }}/historical-study-public" --recipient docs/HISTORICAL_ARTIFACT_RECIPIENT.pem --label study
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-registered-study-once
          path: ${{ runner.temp }}/historical-study-public/*
          if-no-files-found: error
