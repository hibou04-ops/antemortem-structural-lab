name: Python tests
permissions:
  contents: read
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install -e .
          python -m pip install pytest build
      - name: Test
        run: python -m pytest -q
      - name: Build source distribution and wheel
        run: python -m build
      - name: Check wheel outside the source checkout
        run: python scripts/check-wheel.py dist/antemortem_structural_lab-0.2.0-py3-none-any.whl
