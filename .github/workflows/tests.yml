name: Python tests
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  consolidate-existing-public-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: v0.8.0a1
          path: published-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          run-id: 41226721157
          github-token: ${{ github.token }}
          path: originals
      - name: Correct only auditor directory matcher and expose preserved execution findings
        run: python audit/public/consolidate.py --source published-source --originals originals --output consolidated-audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-public-audit-consolidated
          path: consolidated-audit
          if-no-files-found: error
