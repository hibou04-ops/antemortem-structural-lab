name: Python tests
permissions:
  contents: read
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and optional solver
        run: python -m pip install -e ".[solver]"
      - name: Install test and build tools
        run: python -m pip install pytest build twine
      - name: Test
        run: python -m pytest -q
      - name: Build source distribution and wheel
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - name: Check public source and artifact contents
        run: python scripts/check-public-scope.py
      - name: Check wheel outside the source checkout
        run: python scripts/check-wheel.py
  generator-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: docker pull python:3.12-slim
      - name: Verify restricted generator filesystem and network
        run: python scripts/check-isolation.py
